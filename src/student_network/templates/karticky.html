{% extends 'base_app.html' %}

{% block title %}Kartičky{% endblock %}

{% block content %}
<div class="cards-container">
    <div class="cards-header">
        <a href="{{ url_for('aplikacia_ucenie') }}" class="back-button" title="Späť na sekciu Učenie">
            <span>←</span> Späť
        </a>
        <h1>Kartičky</h1>
        <div class="header-spacer"></div>
    </div>

    <div class="cards-content">
        <!-- Moje kartičky sekcia -->
        <section class="cards-section my-decks-section">
            <h2>Moje kartičky</h2>
            <div id="decksContainer" class="decks-grid">
                <!-- Balíčky sa budú dynamicky načítavať sem -->
            </div>
            <div id="emptyDecks" class="empty-state" style="display: none;">
                <p>Nemáte vytvorené žiadne balíčky kartičiek.</p>
            </div>
        </section>

        <!-- Vytvoriť nové kartičky sekcia -->
        <section class="cards-section create-deck-section">
            <h2>Vytvoriť nové kartičky</h2>
            <div class="create-deck-form">
                <div class="form-group">
                    <label for="deckName">Názov balíčka:</label>
                    <input type="text" id="deckName" placeholder="Mô j vzorový balíček" required>
                </div>
                <div class="form-group">
                    <label for="deckDescription">Popis (nepovinne):</label>
                    <textarea id="deckDescription" placeholder="Opis balíčka..." rows="3"></textarea>
                </div>
                <button class="btn-create-deck" id="createDeckBtn">Vytvoriť balíček</button>
            </div>
        </section>
    </div>
</div>

<!-- Modal pre editáciu balíčka -->
<div id="deckModal" class="modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="deckModalTitle">Nový balíček</h2>
            <button class="close-modal">&times;</button>
        </div>
        <div class="deck-editor">
            <div class="deck-info">
                <p id="deckCardCount" class="card-count">Kartičky: 0</p>
            </div>
            <div id="cardsContainer" class="cards-list">
                <!-- Kartičky sa budú dynamicky načítavať sem -->
            </div>
            <button class="btn-add-card" id="addCardBtn">+ Pridať kartičku</button>
            <div class="modal-buttons">
                <button class="btn-primary" id="saveDeckBtn">Hotovo</button>
                <button class="btn-danger" id="deleteDeckBtn">Vymazať balíček</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal pre pridávanie kartičky -->
<div id="cardModal" class="modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Nová kartička</h2>
            <button class="close-modal">&times;</button>
        </div>
        <form id="cardForm" class="card-form">
            <div class="form-group">
                <label for="cardQuestion">Otázka:</label>
                <textarea id="cardQuestion" placeholder="Čo je otázka?" required></textarea>
            </div>
            <div class="form-group">
                <label for="cardAnswer">Odpoveď:</label>
                <textarea id="cardAnswer" placeholder="Čo je odpoveď?" required></textarea>
            </div>
            <div class="form-group">
                <label for="cardColor">Farba kartičky:</label>
                <div class="color-picker">
                    <input type="color" id="cardColor" title="Vyberte farbu">
                    <div class="color-presets">
                        <button type="button" class="color-btn" style="background-color: #FFE5B4;" data-color="#FFE5B4" title="Béžová"></button>
                        <button type="button" class="color-btn" style="background-color: #FFB6C1;" data-color="#FFB6C1" title="Ružová"></button>
                        <button type="button" class="color-btn" style="background-color: #ADD8E6;" data-color="#ADD8E6" title="Modrá"></button>
                        <button type="button" class="color-btn" style="background-color: #90EE90;" data-color="#90EE90" title="Zelená"></button>
                        <button type="button" class="color-btn" style="background-color: #FFD700;" data-color="#FFD700" title="Zlatá"></button>
                        <button type="button" class="color-btn" style="background-color: #DDA0DD;" data-color="#DDA0DD" title="Fialová"></button>
                    </div>
                </div>
            </div>
            <div class="modal-buttons">
                <button type="submit" class="btn-primary">Uložiť kartičku</button>
                <button type="button" class="btn-secondary" id="cancelCardBtn">Zrušiť</button>
            </div>
        </form>
    </div>
</div>

<script>
    let decks = [];
    let currentDeckId = null;
    let currentCards = [];
    let currentEditingCardId = null;

    // DOM elementy
    const decksContainer = document.getElementById('decksContainer');
    const emptyDecks = document.getElementById('emptyDecks');
    const deckNameInput = document.getElementById('deckName');
    const deckDescriptionInput = document.getElementById('deckDescription');
    const createDeckBtn = document.getElementById('createDeckBtn');
    const deckModal = document.getElementById('deckModal');
    const deckModalTitle = document.getElementById('deckModalTitle');
    const cardModal = document.getElementById('cardModal');
    const cardsContainer = document.getElementById('cardsContainer');
    const addCardBtn = document.getElementById('addCardBtn');
    const cardForm = document.getElementById('cardForm');
    const cardQuestion = document.getElementById('cardQuestion');
    const cardAnswer = document.getElementById('cardAnswer');
    const cardColor = document.getElementById('cardColor');
    const deckCardCount = document.getElementById('deckCardCount');
    const saveDeckBtn = document.getElementById('saveDeckBtn');
    const deleteDeckBtn = document.getElementById('deleteDeckBtn');
    const cancelCardBtn = document.getElementById('cancelCardBtn');

    // Inicializácia
    document.addEventListener('DOMContentLoaded', () => {
        loadDecks();
        attachEventListeners();
    });

    function attachEventListeners() {
        createDeckBtn.addEventListener('click', createNewDeck);
        addCardBtn.addEventListener('click', () => openCardModal(null));
        cardForm.addEventListener('submit', saveCard);
        cancelCardBtn.addEventListener('click', closeCardModal);
        saveDeckBtn.addEventListener('click', closeDeckModal);
        deleteDeckBtn.addEventListener('click', deleteDeck);

        // Modal closing
        document.querySelectorAll('.close-modal').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.target.closest('.modal').style.display = 'none';
            });
        });

        deckModal.addEventListener('click', (e) => {
            if (e.target === deckModal) deckModal.style.display = 'none';
        });

        cardModal.addEventListener('click', (e) => {
            if (e.target === cardModal) closeCardModal();
        });

        // Farby
        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                cardColor.value = btn.dataset.color;
            });
        });
    }

    function loadDecks() {
        fetch('{{ url_for("api_get_decks") }}')
            .then(response => response.json())
            .then(data => {
                decks = data.decks || [];
                renderDecks();
            })
            .catch(error => console.error('Chyba pri načítaní balíčkov:', error));
    }

    function renderDecks() {
        decksContainer.innerHTML = '';

        if (decks.length === 0) {
            emptyDecks.style.display = 'block';
            return;
        }

        emptyDecks.style.display = 'none';

        decks.forEach(deck => {
            const deckCard = document.createElement('div');
            deckCard.className = 'deck-card';
            deckCard.innerHTML = `
                <div class="deck-card-content">
                    <h3>${escapeHtml(deck.name)}</h3>
                    <p class="deck-meta">${deck.card_count} kartičiek</p>
                    ${deck.description ? `<p class="deck-desc">${escapeHtml(deck.description)}</p>` : ''}
                </div>
                <div class="deck-actions">
                    <button class="btn-learn" data-deck-id="${deck.id}" title="Učiť sa">Učiť sa</button>
                    <button class="btn-edit" data-deck-id="${deck.id}" title="Upraviť">✎</button>
                </div>
            `;

            deckCard.querySelector('.btn-learn').addEventListener('click', () => {
                window.location.href = `{{ url_for('aplikacia_karticky_learn', deck_id=0) }}`.replace('/0', `/${deck.id}`);
            });

            deckCard.querySelector('.btn-edit').addEventListener('click', () => {
                openDeckModal(deck.id);
            });

            decksContainer.appendChild(deckCard);
        });
    }

    function createNewDeck() {
        const name = deckNameInput.value.trim();
        const description = deckDescriptionInput.value.trim();

        if (!name) {
            alert('Názov balíčka je povinný');
            return;
        }

        fetch('{{ url_for("api_create_deck") }}', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, description }),
        })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    deckNameInput.value = '';
                    deckDescriptionInput.value = '';
                    openDeckModal(result.deck_id);
                    loadDecks();
                } else {
                    alert('Chyba: ' + result.message);
                }
            })
            .catch(error => {
                console.error('Chyba pri vytváraní balíčka:', error);
                alert('Chyba pri vytváraní balíčka');
            });
    }

    function openDeckModal(deckId) {
        currentDeckId = deckId;
        currentEditingCardId = null;
        loadDeckCards(deckId);
        deckModal.style.display = 'block';
    }

    function closeDeckModal() {
        deckModal.style.display = 'none';
        currentDeckId = null;
        currentCards = [];
    }

    function loadDeckCards(deckId) {
        const deck = decks.find(d => d.id === deckId);
        deckModalTitle.textContent = deck ? deck.name : 'Balíček';
        deckCardCount.textContent = `Kartičky: 0`;

        fetch(`{{ url_for("api_get_cards", deck_id=0) }}`.replace('/0', `/${deckId}`))
            .then(response => response.json())
            .then(data => {
                currentCards = data.cards || [];
                renderCards();
            })
            .catch(error => console.error('Chyba pri načítaní kartičiek:', error));
    }

    function renderCards() {
        cardsContainer.innerHTML = '';
        deckCardCount.textContent = `Kartičky: ${currentCards.length}`;

        currentCards.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'card-item';
            cardEl.style.backgroundColor = card.color;
            cardEl.innerHTML = `
                <div class="card-item-content">
                    <p class="card-q"><strong>Q:</strong> ${escapeHtml(card.question.substring(0, 50))}...</p>
                    <p class="card-a"><strong>A:</strong> ${escapeHtml(card.answer.substring(0, 50))}...</p>
                </div>
                <button class="btn-delete-card" data-card-id="${card.id}" title="Vymazať">✕</button>
            `;

            cardEl.querySelector('.btn-delete-card').addEventListener('click', () => {
                deleteCard(card.id);
            });

            cardsContainer.appendChild(cardEl);
        });
    }

    function openCardModal(cardId) {
        currentEditingCardId = cardId;
        cardQuestion.value = '';
        cardAnswer.value = '';
        cardColor.value = '#FFE5B4';

        cardModal.style.display = 'block';
        cardQuestion.focus();
    }

    function closeCardModal() {
        cardModal.style.display = 'none';
        currentEditingCardId = null;
        cardForm.reset();
    }

    function saveCard(e) {
        e.preventDefault();

        const question = cardQuestion.value.trim();
        const answer = cardAnswer.value.trim();
        const color = cardColor.value;

        if (!question || !answer) {
            alert('Otázka a odpoveď sú povinné');
            return;
        }

        fetch(`{{ url_for("api_create_card", deck_id=0) }}`.replace('/0', `/${currentDeckId}`), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question, answer, color }),
        })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    loadDeckCards(currentDeckId);
                    closeCardModal();
                } else {
                    alert('Chyba: ' + result.message);
                }
            })
            .catch(error => {
                console.error('Chyba pri ukladaní kartičky:', error);
                alert('Chyba pri ukladaní kartičky');
            });
    }

    function deleteCard(cardId) {
        if (!confirm('Naozaj chcete vymazať túto kartičku?')) return;

        fetch(`{{ url_for("api_delete_card", deck_id=0, card_id=0) }}`.replace('/0/', `/${currentDeckId}/`).replace('/0', `/${cardId}`), {
            method: 'DELETE',
        })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    loadDeckCards(currentDeckId);
                }
            })
            .catch(error => console.error('Chyba pri vymazávaní kartičky:', error));
    }

    function deleteDeck() {
        if (!confirm('Naozaj chcete vymazať tento balíček?')) return;

        fetch(`{{ url_for("api_delete_deck", deck_id=0) }}`.replace('/0', `/${currentDeckId}`), {
            method: 'DELETE',
        })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    loadDecks();
                    closeDeckModal();
                }
            })
            .catch(error => console.error('Chyba pri vymazávaní balíčka:', error));
    }

    function escapeHtml(text) {
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return text.replace(/[&<>"']/g, m => map[m]);
    }
</script>

<style>

        padding: 20px;

    }

    .btn-edit:hover {
        background-color: #0b7dda;
    }

    .empty-state {
        padding: 40px 20px;

    }

    .create-deck-form {
        background: #f9f9f9;

        padding: 20px;

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;

        }
