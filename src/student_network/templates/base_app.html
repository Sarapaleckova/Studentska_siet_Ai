<!doctype html>
<html lang="sk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Študentská sieť{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body
    class="page page-app"
    style="--app-bg-color: {{ app_theme.bg_color }}; --app-nav-color: {{ app_theme.nav_color }}; --app-bg-image: {{ app_theme.bg_image_css }};"
>
    <header class="top-nav">
        <div class="top-nav-inner">
            <a class="app-title" href="{{ url_for('aplikacia_domov') }}">Študentská sieť</a>
            <div class="top-nav-actions">
                <button id="pm-button" class="top-nav-icon" data-tooltip="Správy" title="Správy" aria-label="Správy">
                    <svg class="pm-svg-icon" width="20" height="14" viewBox="0 0 24 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M2 3.5C2 2.6716 2.6716 2 3.5 2H20.5C21.3284 2 22 2.6716 22 3.5V14.5C22 15.3284 21.3284 16 20.5 16H3.5C2.6716 16 2 15.3284 2 14.5V3.5Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M3 4L12 9.5L21 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span id="pm-unread-badge" class="pm-unread-badge" aria-hidden="true" hidden>0</span>
                </button>
                <a
                    class="top-profile-link {% if active_tab == 'profil' %}active{% endif %}"
                    href="{{ url_for('aplikacia_profil') }}"
                    title="Profil"
                    aria-label="Profil"
                >
                    {% if top_nav_profile_photo_url %}
                        <img class="top-profile-image" src="{{ top_nav_profile_photo_url }}" alt="Profilová fotografia používateľa">
                    {% else %}
                        <span class="top-profile-fallback" aria-hidden="true">{{ top_nav_profile_initial }}</span>
                    {% endif %}
                </a>
                <a class="exit-link" id="logout-link" href="{{ url_for('odhlasenie') }}">Odhlásiť sa</a>
            </div>
        </div>
    </header>

    <main class="app-content">
        {% block content %}{% endblock %}
    </main>

    {% if not hide_main_nav %}
    <nav class="bottom-nav">
        <a class="nav-item {% if active_tab == 'domov' %}active{% endif %}" href="{{ url_for('aplikacia_domov') }}">Domov</a>
        <a class="nav-item {% if active_tab == 'skupiny' %}active{% endif %}" href="{{ url_for('aplikacia_skupiny') }}">Skupiny</a>
        <a class="nav-item {% if active_tab == 'hladat' %}active{% endif %}" href="{{ url_for('aplikacia_hladat') }}">Hľadať</a>
        <a class="nav-item {% if active_tab == 'pridat' %}active{% endif %}" href="{{ url_for('aplikacia_pridat') }}">Pridať</a>
    </nav>
    {% endif %}

    <script>
    (function () {
        const logoutLink = document.getElementById('logout-link');
        if (!logoutLink) {
            return;
        }

        logoutLink.addEventListener('click', function (event) {
            const confirmed = window.confirm('Naozaj sa chcete odhlásiť?');
            if (!confirmed) {
                event.preventDefault();
            }
        });
    })();
    </script>

    {% block scripts %}{% endblock %}

    <div id="pm-popup" class="pm-popup" aria-hidden="true">
        <div class="pm-popup-backdrop" data-close-pm></div>
        <div class="pm-popup-panel" role="dialog" aria-modal="true" aria-labelledby="pm-popup-title">
            <div class="pm-popup-header">
                <h3 id="pm-popup-title">Súkromné správy</h3>
                <div>
                    <button id="pm-compose-btn" class="btn">+</button>
                    <button id="pm-popup-close" class="btn btn-link">X</button>
                </div>
            </div>

            <div class="pm-tabs">
                <button data-pm-tab="inbox" class="pm-tab active">Prijaté</button>
                <button data-pm-tab="sent" class="pm-tab">Odoslané</button>
                <button data-pm-tab="unread" class="pm-tab">Neprečítané</button>
            </div>

            <div class="pm-search-box">
                <input id="pm-search" type="text" placeholder="Hľadaj v správach..." class="pm-search-input">
                <svg class="pm-search-box-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M10 18C14.4183 18 18 14.4183 18 10C18 5.58172 14.4183 2 10 2C5.58172 2 2 5.58172 2 10C2 14.4183 5.58172 18 10 18Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M16 16L22 22" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>

            <div id="pm-detail" class="pm-detail" hidden>
                <div class="pm-detail-head"><strong id="pm-detail-author"></strong><span id="pm-detail-time" class="pm-item-time"></span></div>
                <div id="pm-detail-body" class="pm-detail-body"></div>
                <div class="pm-detail-actions">
                    <button id="pm-detail-reply" class="btn btn-primary">Odpovedať</button>
                    <button id="pm-detail-back" class="btn btn-link">Späť</button>
                </div>
            </div>

            <div class="pm-list" id="pm-list"></div>

            <div id="pm-compose" class="pm-compose" hidden>
                <label for="pm-recipient">Komu</label>
                <div class="pm-recipient-search-wrapper">
                    <input id="pm-recipient" type="text" placeholder="Meno alebo e-mail...">
                    <svg class="pm-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M10 18C14.4183 18 18 14.4183 18 10C18 5.58172 14.4183 2 10 2C5.58172 2 2 5.58172 2 10C2 14.4183 5.58172 18 10 18Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M16 16L22 22" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div id="pm-recipient-results" class="pm-recipient-results"></div>
                <label for="pm-content">Správa</label>
                <textarea id="pm-content" rows="4"></textarea>
                <div class="pm-compose-actions">
                    <button id="pm-send" class="btn btn-primary">Odoslať</button>
                    <button id="pm-cancel" class="btn btn-link">Zrušiť</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    (function () {
        const pmButton = document.getElementById('pm-button');
        const pmPopup = document.getElementById('pm-popup');
        const pmClose = document.getElementById('pm-popup-close');
        const pmBackdrop = pmPopup ? pmPopup.querySelector('[data-close-pm]') : null;
        const pmList = document.getElementById('pm-list');
        const pmBadge = document.getElementById('pm-unread-badge');
        const pmComposeBtn = document.getElementById('pm-compose-btn');
        const pmCompose = document.getElementById('pm-compose');
        const pmRecipient = document.getElementById('pm-recipient');
        const pmRecipientResults = document.getElementById('pm-recipient-results');
        const pmContent = document.getElementById('pm-content');
        const pmSend = document.getElementById('pm-send');
        const pmCancel = document.getElementById('pm-cancel');
        const pmSearch = document.getElementById('pm-search');

        const pmDetail = document.getElementById('pm-detail');
        const pmDetailAuthor = document.getElementById('pm-detail-author');
        const pmDetailTime = document.getElementById('pm-detail-time');
        const pmDetailBody = document.getElementById('pm-detail-body');
        const pmDetailReply = document.getElementById('pm-detail-reply');
        const pmDetailBack = document.getElementById('pm-detail-back');
        let currentDetailItem = null;
        let currentMessages = { sent: [], received: [], unread: [] };
        let currentTab = 'inbox';

        const api = {
            unreadCount: function () { return fetch('{{ url_for('messages_unread_count') }}').then(r=>r.json()); },
            fetchMessages: function () { return fetch('{{ url_for('messages_endpoint') }}').then(r=>r.json()); },
            sendMessage: function (recipient_id, content, reply_to) {
                const data = new URLSearchParams(); data.append('recipient_id', recipient_id); data.append('content', content); if (reply_to) data.append('reply_to', reply_to);
                return fetch('{{ url_for('messages_endpoint') }}', { method: 'POST', body: data }).then(r=>r.json());
            },
            markRead: function (id) { return fetch('{{ url_for('messages_mark_read', message_id=0) }}'.replace('/0/', '/' + id + '/'), { method: 'POST' }).then(r=>r.json()); },
            searchUsers: function (q) { return fetch('{{ url_for('users_search') }}?q=' + encodeURIComponent(q)).then(r=>r.json()); }
        };

        function updateBadge() {
            api.unreadCount().then(data => {
                const count = data && data.count ? data.count : 0;
                if (count > 0) {
                    pmBadge.textContent = count;
                    pmBadge.hidden = false;
                } else {
                    pmBadge.hidden = true;
                }
            }).catch(()=>{});
        }

        function openMessageDetail(item, tab) {
            currentDetailItem = item;
            pmList.hidden = true;
            pmDetail.hidden = false;
            pmDetailAuthor.textContent = tab === 'sent' ? (item.recipient_name || 'Neznámy') : (item.sender_name || 'Neznámy');
            pmDetailTime.textContent = item.created_at || '';
            pmDetailBody.textContent = item.content || '';

            if (!item.is_read && tab !== 'sent') {
                api.markRead(item.id).then(()=>{ updateBadge(); const el = document.querySelector('.pm-item[data-id="'+item.id+'"]'); if (el) el.classList.remove('pm-unread'); });
            }
        }

        function closeMessageDetail() {
            currentDetailItem = null;
            pmDetail.hidden = true;
            pmList.hidden = false;
        }

        function renderMessages(data, tab) {
            currentMessages = data;
            currentTab = tab;
            pmSearch.value = '';
            applyMessageFilter(tab, '');
        }

        function applyMessageFilter(tab, query) {
            pmList.innerHTML = '';
            pmList.hidden = false;
            pmDetail.hidden = true;
            const rows = (tab === 'sent') ? currentMessages.sent : (tab === 'unread' ? currentMessages.unread : currentMessages.received);
            if (!rows || rows.length === 0) {
                pmList.innerHTML = '<p class="empty-note">Žiadne správy.</p>';
                return;
            }

            const q = query.toLowerCase();
            const filtered = rows.filter(item => {
                const name = (tab === 'sent' ? item.recipient_name : item.sender_name || '').toLowerCase();
                const content = (item.content || '').toLowerCase();
                return !q || name.includes(q) || content.includes(q);
            });

            if (filtered.length === 0) {
                pmList.innerHTML = '<p class="empty-note">Žiadne výsledky.</p>';
                return;
            }

            filtered.forEach(item => {
                const el = document.createElement('article');
                el.className = 'pm-item';
                el.dataset.id = item.id;
                el.innerHTML = `<div class="pm-item-head"><strong>${tab==='sent'?item.recipient_name:item.sender_name}</strong><span class="pm-item-time">${item.created_at}</span></div><div class="pm-item-body">${item.content}</div>`;
                el.addEventListener('click', function () {
                    openMessageDetail(item, tab);
                });
                if (!item.is_read && tab !== 'sent') el.classList.add('pm-unread');
                pmList.appendChild(el);
            });
        }

        function openPopup() {
            pmPopup.classList.add('is-open');
            pmPopup.setAttribute('aria-hidden','false');
            fetchAndRender('inbox');
        }

        function closePopup() {
            pmPopup.classList.remove('is-open');
            pmPopup.setAttribute('aria-hidden','true');
            pmCompose.hidden = true;
            pmDetail.hidden = true;
        }

        function fetchAndRender(tab) {
            api.fetchMessages().then(data => renderMessages(data, tab)).catch(()=>{ pmList.innerHTML = '<p class="empty-note">Chyba pri načítaní.</p>'; });
        }

        if (pmButton) pmButton.addEventListener('click', openPopup);
        if (pmClose) pmClose.addEventListener('click', closePopup);
        if (pmBackdrop) pmBackdrop.addEventListener('click', closePopup);

        document.addEventListener('click', function (e) {
            const tabButton = e.target.closest('.pm-tab');
            if (tabButton) {
                document.querySelectorAll('.pm-tab').forEach(b=>b.classList.remove('active'));
                tabButton.classList.add('active');
                const tab = tabButton.dataset.pmTab;
                api.fetchMessages().then(data => renderMessages(data, tab)).catch(()=>{ pmList.innerHTML = '<p class="empty-note">Chyba pri načítaní.</p>'; });
            }

            if (e.target === pmComposeBtn) {
                pmCompose.hidden = false; pmList.hidden = true; pmDetail.hidden = true; pmRecipient.value = ''; pmContent.value = ''; pmRecipient.dataset.userid = ''; pmRecipientResults.innerHTML = ''; pmRecipient.focus();
            }
        });

        pmSearch.addEventListener('input', function () {
            const query = pmSearch.value.trim();
            applyMessageFilter(currentTab, query);
        });

        if (pmDetailBack) pmDetailBack.addEventListener('click', function () { closeMessageDetail(); });
        if (pmDetailReply) pmDetailReply.addEventListener('click', function () {
            if (!currentDetailItem) return;
            pmCompose.hidden = false;
            pmList.hidden = true;
            pmDetail.hidden = true;
            pmRecipient.value = currentDetailItem.sender_name || '';
            pmRecipient.dataset.userid = currentDetailItem.sender_id || '';
            pmContent.value = '';
            pmSend.dataset.replyTo = currentDetailItem.id;
            pmRecipient.focus();
        });

        pmCancel.addEventListener('click', function () { pmCompose.hidden = true; pmList.hidden = false; pmSend.dataset.replyTo = ''; });

        let searchTimeout = null;
        pmRecipient.addEventListener('input', function () {
            const q = pmRecipient.value.trim();
            pmRecipientResults.innerHTML = '';
            if (searchTimeout) clearTimeout(searchTimeout);
            if (!q) return;
            searchTimeout = setTimeout(()=>{
                api.searchUsers(q).then(res=>{
                    pmRecipientResults.innerHTML = '';
                    (res.results||[]).forEach(user=>{
                        const btn = document.createElement('button'); btn.type='button'; btn.className='pm-recipient-item'; btn.textContent = user.name; btn.dataset.userid = user.id;
                        btn.addEventListener('click', function () { pmRecipient.value = user.name; pmRecipient.dataset.userid = user.id; pmRecipientResults.innerHTML = ''; });
                        pmRecipientResults.appendChild(btn);
                    });
                });
            }, 250);
        });

        pmSend.addEventListener('click', function () {
            const recipientId = pmRecipient.dataset.userid || null;
            const content = pmContent.value.trim();
            const replyTo = pmSend.dataset.replyTo || null;
            if (!recipientId) { alert('Vyberte príjemcu zo zoznamu.'); return; }
            if (!content) { alert('Zadajte text správy.'); return; }
            api.sendMessage(recipientId, content, replyTo).then(r=>{
                if (r && r.ok) { alert('Správa odoslaná.'); pmCompose.hidden = true; pmSend.dataset.replyTo = ''; fetchAndRender('sent'); updateBadge(); }
                else alert(r.error || 'Chyba pri odosielaní.');
            });
        });

        // initial badge
        updateBadge();
        setInterval(updateBadge, 30000);
    })();
    </script>
</body>
</html>
